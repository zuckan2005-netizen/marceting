<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Карго-миссия «Северная Ягода»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ночной порт. Один экран-«причал» за раз, сверху HUD рейса; каждая стратегия — свой цвет контейнера. */
:root{
  --sea:#0A1624; --deck:#11233A; --deck2:#18304E; --line:#29466A; --ink:#EAF1F7; --muted:#94AAC0;
  --signal:#FFD047; --signal-ink:#1A1300;
  --c-ind:#4C8DFF; --c-dir:#FF6B2C; --c-all:#2FBFA8; --c-jv:#E5486A; --c-fdi:#7D8FA6;
  --good:#3EDB98; --bad:#FF5B70;
  --f-display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body:'Golos Text', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:
   radial-gradient(1200px 500px at 85% -10%, rgba(76,141,255,.16), transparent 60%),
   radial-gradient(900px 400px at -10% 110%, rgba(47,191,168,.10), transparent 60%);
  background-attachment:fixed;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.mono{font-family:var(--f-mono);letter-spacing:.04em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,22,36,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em}
.brand small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.hud-stat{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;background:var(--deck);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.hud-stat em{font-style:normal;color:var(--signal);font-weight:700}
.hud-btn{background:var(--deck);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-family:var(--f-mono)}
.hud-btn:hover{border-color:var(--signal)}

/* Stage */
main{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.screen{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.2;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:clamp(28px,5vw,46px);font-weight:800}
.h2{font-size:clamp(20px,3.2vw,28px);font-weight:700}
.lead{color:#C7D5E3;font-size:17px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px;background:var(--signal);color:var(--signal-ink);box-shadow:0 4px 0 #B88F12;transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #B88F12}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #B88F12}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--signal)}
.btn[disabled]{opacity:.4;pointer-events:none}

.panel{background:var(--deck);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-size:16px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.grid2>*,.grid3>*{min-width:0}
ul.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
ul.clean li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--dot,var(--muted))}
.plus li{--dot:var(--good)} .minus li{--dot:var(--bad)}
.note{border-left:3px solid var(--signal);padding:10px 14px;background:rgba(255,208,71,.07);border-radius:0 10px 10px 0;color:#DCE6EF}
.note b{color:var(--signal)}

/* Intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.intro>*{min-width:0}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro .h1 span{display:block;color:var(--signal)}
.ship-wrap{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:20px;overflow:hidden;background:linear-gradient(#0E2440,#0A1A2E 70%);border:1px solid var(--line)}
.ship-wrap svg{width:100%;height:100%;display:block}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:50% 70%}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.wave{animation:wave 6s linear infinite}
.wave.w2{animation-duration:9s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-200px)}}
.name-field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.name-field label{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.name-field input{background:var(--deck);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);padding:13px 14px;font:inherit;font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--deck);border:1px solid var(--line)}
.chip i{width:14px;height:10px;border-radius:2px;background:var(--cc)}

/* Hub */
.hub-head{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.route{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.route::before{content:"";position:absolute;left:31px;top:20px;bottom:20px;border-left:2px dashed var(--line)}
.port button{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--deck);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 10px;position:relative;transition:transform .15s,border-color .15s}
.port.open button:hover,.port.done button:hover{transform:translateX(4px);border-color:var(--pc)}
.port.locked button{opacity:.45;cursor:not-allowed}
.pin{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--sea);border:2px solid var(--pc);color:var(--pc);position:relative;z-index:1}
.port.done .pin{background:var(--pc);color:#0A1624}
.port.current .pin{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.port-body{display:flex;flex-direction:column;min-width:0;flex:1}
.port-body strong{font-family:var(--f-display);font-size:17px;font-weight:700}
.port-body span:last-child{color:var(--muted);font-size:14px}
.port-code{font-size:11px;color:var(--pc);text-transform:uppercase;letter-spacing:.12em}
.port-state{font-size:12px;color:var(--muted);white-space:nowrap}
.port.done .port-state{color:var(--good)}
.port.current .port-state{color:var(--signal)}
@media (max-width:520px){.port-state{display:none}}
.hub-foot{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.rankbar{height:10px;background:var(--sea);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.rankbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-ind),var(--c-all),var(--signal));border-radius:99px;transition:width .8s}
.stamps{display:flex;flex-wrap:wrap;gap:10px}
.stamp{--sc:var(--signal);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:66px;border:3px double var(--sc);color:var(--sc);border-radius:10px;font-family:var(--f-mono);font-size:9.5px;line-height:1.2;text-align:center;text-transform:uppercase;letter-spacing:.06em;transform:rotate(var(--rot,-4deg));padding:4px;opacity:.95}
.stamp b{font-family:var(--f-display);font-size:10px;letter-spacing:0}
.stamp.empty{--sc:var(--line);opacity:.6}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px 0}

/* Level header */
.lv-head{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lv-tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--lc)}
.lv-tag i{width:26px;height:16px;border-radius:3px;background:var(--lc);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 5px)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--deck);border-radius:999px;padding:6px 12px;font-size:13px;font-family:var(--f-mono);color:var(--muted)}
.step.on{background:var(--lc);border-color:var(--lc);color:#0A1624;font-weight:700}
.step:disabled{opacity:.5;cursor:default}

/* Ladder */
.ladder-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.ladder-tabs{grid-template-columns:repeat(2,1fr)}}
.ltab{border:1.5px solid var(--line);background:var(--deck);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.ltab .cont{height:22px;border-radius:3px;background:var(--cc);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 6px)}
.ltab span{font-size:13px;font-weight:600;line-height:1.25}
.ltab.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,var(--deck))}
.stairs{display:flex;align-items:flex-end;gap:6px;height:90px}
.stairs div{flex:1;border-radius:4px 4px 0 0;background:var(--cc);opacity:.35;transition:opacity .3s, transform .3s;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 6px)}
.stairs div.on{opacity:1;transform:translateY(-4px)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--sea);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--cc);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:460px){.bar{grid-template-columns:1fr 34px}.bar .track{grid-column:1/-1;grid-row:2}}

/* Flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.flip{perspective:900px;min-height:250px;border:0;background:none;padding:0;text-align:left}
.flip-in{position:relative;width:100%;height:100%;min-height:250px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);overflow:auto}
.front{background:var(--deck);justify-content:space-between}
.front .crate{height:54px;border-radius:6px;background:var(--cc);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.24) 0 3px,transparent 3px 9px);display:flex;align-items:center;padding:0 12px;font-family:var(--f-mono);font-weight:700;color:#0A1624;font-size:13px;letter-spacing:.08em}
.front strong{font-family:var(--f-display);font-size:16px;line-height:1.25}
.front small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.back{background:var(--deck2);transform:rotateY(180deg);font-size:14px;line-height:1.5}
.back .ex{margin-top:auto;font-size:13px;color:#CBD8E5;border-top:1px dashed var(--line);padding-top:8px}
.back .ex b{color:var(--signal);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;display:block}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--deck2)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--muted)}

/* Sorter / quiz shared */
.game-card{background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.g-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-top em{font-style:normal;color:var(--signal);font-weight:700}
.combo{padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.combo.hot{border-color:var(--signal);color:var(--signal);animation:hot .6s ease-in-out infinite alternate}
@keyframes hot{to{box-shadow:0 0 14px rgba(255,208,71,.5)}}
.timer{height:8px;border-radius:99px;background:var(--sea);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--good);border-radius:99px}
.timer i.low{background:var(--bad)}
.cargo{position:relative;background:var(--deck2);border:2px dashed var(--line);border-radius:14px;padding:22px 20px 20px;min-height:130px;display:flex;align-items:center;transition:transform .45s cubic-bezier(.5,0,.5,1),opacity .45s}
.cargo p{font-size:clamp(17px,2.3vw,20px);font-weight:500;line-height:1.45}
.cargo .ctag{position:absolute;top:-11px;left:16px;background:var(--signal);color:var(--signal-ink);font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.08em}
.cargo.fly-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.cargo.fly-r{transform:translateX(120%) rotate(8deg);opacity:0}
.cargo.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gate{border:0;border-radius:14px;padding:18px 12px;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,2.4vw,18px);color:#0A1624;background:var(--gc);box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 55%,#000);transition:transform .1s}
.gate:hover{transform:translateY(-2px)}
.gate:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--gc) 55%,#000)}
.gate small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.75;margin-top:4px}
.gate:disabled{opacity:.35}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:enter .3s}
.fb.ok{background:color-mix(in srgb,var(--good) 14%,var(--deck));border:1px solid color-mix(in srgb,var(--good) 50%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 13%,var(--deck));border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.fb.mid{background:color-mix(in srgb,var(--signal) 12%,var(--deck));border:1px solid color-mix(in srgb,var(--signal) 45%,transparent)}
.fb strong{font-family:var(--f-display);font-size:15px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)} .fb.mid strong{color:var(--signal)}
.fb .btn{align-self:flex-start;padding:10px 16px;font-size:15px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.quiz h3{font-family:var(--f-body);font-weight:700;font-size:clamp(18px,2.4vw,21px);line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--deck2);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--signal);transform:translateX(3px)}
.opt .k{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--muted);width:22px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--deck2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--deck2))}
.opt.part{border-color:var(--signal)}
.opt:disabled{cursor:default}
.opt .sw{flex:none;width:18px;height:14px;border-radius:3px;margin-top:4px;background:var(--cc);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 5px)}

/* Order puzzle */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;min-height:50px;color:var(--muted);font-size:15px}
.slot b{font-family:var(--f-mono);width:20px}
.slot.filled{border-style:solid;border-color:var(--cc);color:var(--ink);background:color-mix(in srgb,var(--cc) 14%,var(--deck));animation:enter .3s}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pchip{border:1.5px solid var(--line);background:var(--deck2);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.pchip i{width:16px;height:12px;border-radius:2px;background:var(--cc)}
.pchip:hover{border-color:var(--signal)}
.pchip.shake{animation:shake .4s;border-color:var(--bad)}

/* Meters (negotiation) */
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.meters{grid-template-columns:1fr}}
.meter{background:var(--deck2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.meter span{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.meter span b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter .track{height:10px;background:var(--sea);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1),background .3s}
.delta{font-family:var(--f-mono);font-size:12px;font-weight:700}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.choice{text-align:left;background:var(--deck2);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--c-jv);transform:translateY(-3px)}
.choice b{font-size:15px}
.choice small{color:var(--muted);font-size:13px}
.choice.picked{border-color:var(--signal)}
.choice:disabled{cursor:default}
.partner{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c-all);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#0A1624}
.bubble{background:var(--deck2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:15px}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.mem{grid-template-columns:repeat(2,1fr)}}
.mcard{perspective:700px;border:0;background:none;padding:0;min-height:130px}
.mcard .flip-in{min-height:130px}
.mcard .face{padding:12px;justify-content:center;font-size:14px;line-height:1.35}
.mcard .front{background:var(--deck2);align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 3px,transparent 3px 10px)}
.mcard .front span{font-family:var(--f-display);font-size:24px;color:var(--c-all)}
.mcard .back.name{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--c-all)}
.mcard.matched .back{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--deck2))}
.mcard.on .flip-in,.mcard.matched .flip-in{transform:rotateY(180deg)}

/* Boss */
.lives{display:flex;gap:5px}
.lives i{width:20px;height:14px;border-radius:2px;background:var(--c-dir);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 5px)}
.lives i.lost{background:var(--line)}
.case-co{font-family:var(--f-mono);font-size:12px;color:var(--signal);letter-spacing:.08em;text-transform:uppercase}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.78);display:grid;place-items:center;padding:20px;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:var(--deck);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.big-stamp{width:180px;height:120px;font-size:12px;transform:rotate(-8deg);animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
.big-stamp b{font-size:15px}
@keyframes slam{0%{transform:scale(2.6) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.xp-big{font-family:var(--f-display);font-size:40px;font-weight:800;color:var(--signal);font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--signal);color:var(--signal)}

/* Certificate */
.cert{background:#F3EEE2;color:#1C2633;border-radius:6px;padding:clamp(18px,4vw,36px);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(28,38,51,.06) 31px 32px)}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid #1C2633;border-radius:4px;pointer-events:none}
.cert-in{position:relative;display:flex;flex-direction:column;gap:16px}
.cert .eyebrow{color:#5B6878}
.cert h2{font-size:clamp(22px,4vw,34px);font-weight:800}
.cert dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 16px;margin:0;font-size:15px}
.cert dt{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#5B6878;padding-top:2px}
.cert dd{margin:0;font-weight:600;border-bottom:1px dotted #8A96A3;min-width:0}
@media (max-width:480px){.cert dl{grid-template-columns:1fr}.cert dd{margin-bottom:8px}}
.cert .stamp{--sc:#B4233C}
.cert .rank{font-family:var(--f-display);font-size:clamp(20px,3.5vw,28px);color:#B4233C}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function beep(type){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.07],[990,.12]], bad:[[180,.22]], win:[[523,.1],[659,.1],[784,.1],[1047,.3]], tap:[[880,.04]], stamp:[[120,.12],[90,.18]]}[type]||[[600,.05]];
    let t=AC.currentTime+.01;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type = type==='bad'?'sawtooth':(type==='stamp'?'square':'triangle'); o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(type==='bad'?.08:.14,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.03); t+=d; });
  }catch(e){}
}

const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(RM) return;
  const c=$('#fx'), x=c.getContext('2d'); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=['#4C8DFF','#FF6B2C','#2FBFA8','#E5486A','#FFD047'];
  const ps=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:10+Math.random()*10,h:6+Math.random()*4,c:cols[Math.floor(Math.random()*5)]}));
  let f=0;
  (function loop(){ x.clearRect(0,0,W,H); ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.fillStyle='rgba(0,0,0,.25)';for(let i=-p.w/2+2;i<p.w/2;i+=3)x.fillRect(i,-p.h/2,1,p.h);x.restore();});
    if(++f<150) requestAnimationFrame(loop); else x.clearRect(0,0,W,H); })();
}

/* ============ ТАЙМЕР ============ */
const T={raf:0,left:0};
function startTimer(sec,onEnd){ stopTimer(); const t0=performance.now();
  const tick=now=>{ const bar=$('#tbar'); T.left=Math.max(0,sec-(now-t0)/1000);
    if(bar){ bar.style.width=(T.left/sec*100)+'%'; bar.classList.toggle('low',T.left<sec*.3); }
    if(T.left<=0){ T.raf=0; onEnd(); return; } T.raf=requestAnimationFrame(tick); };
  T.raf=requestAnimationFrame(tick); }
function stopTimer(){ if(T.raf) cancelAnimationFrame(T.raf); T.raf=0; }

function stampHtml(lv,empty,i){

}

/* ============ ЗАВЕРШЕНИЕ УРОВНЯ ============ */
function completeLevel(id, pts){
  const lv=LEVELS.find(l=>l.id===id); pts=Math.max(0,Math.min(lv.max,Math.round(pts)));
  const prev=state.done[id]; const first=prev==null;
  state.done[id]=Math.max(prev||0,pts); save(); hud();
  beep('stamp'); setTimeout(()=>beep('win'),250); confetti();
  const idx=LEVELS.indexOf(lv), next=LEVELS[idx+1];
  const pct=pts/lv.max;
  const ov=$('#overlay');
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Причал пройден">
    <p class="eyebrow">Причал ${lv.num} пройден</p>
    <span class="stamp big-stamp" style="--sc:${lv.color}"><span>Таможня · рейс СЯ-2026</span><b>${lv.title}</b><span>${new Date().toLocaleDateString('ru-RU')}</span></span>
    <div class="xp-big">+${pts} XP</div>
    <p style="color:var(--muted)">${pct>=.9?'Безупречная работа. Совет директоров впечатлён.':pct>=.65?'Хороший результат. Груз доставлен почти без потерь.':'Груз доставлен, но с потерями. Можно перепройти и улучшить счёт.'}${!first&&prev>pts?' Ваш рекорд остался прежним: '+prev+' XP.':''}</p>
    ${runBadges.length?`<div class="badges">${runBadges.map(b=>`<span class="badge">Награда: ${BADGE_NAMES[b]}</span>`).join('')}</div>`:''}
    <div class="row" style="justify-content:center">
      ${id==='boss'?`<button class="btn" onclick="go('final')">Получить сертификат →</button>`:next?`<button class="btn" onclick="go('${next.id}')">Следующий причал →</button>`:''}
      <button class="btn ghost" onclick="go('hub')">На карту</button>
    </div></div>`;
  ov.hidden=false; runBadges=[];
  ov.querySelector('.btn')?.focus();
}
function closeOverlay(){ const o=$('#overlay'); if(o){o.hidden=true;o.innerHTML='';} }

/* ============ ДВИЖОК: КВИЗ ============ */
let Q=null;
function runQuiz(qs, onDone, tag){
  Q={qs:qs.map(q=>({...q, sh:shuffle(q.options.map((t,j)=>({t,ok:j===q.answer})))})), i:0, pts:0, correct:0, onDone, tag:tag||'Вопрос'};
  renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i];
  $('#game').innerHTML=`<div class="game-card quiz">
    <div class="g-top"><span>${Q.tag} ${Q.i+1}/${Q.qs.length}</span><span><em>${Q.pts}</em> XP</span></div>
    <h3>${q.q}</h3>
    <div class="opts">${q.sh.map((o,j)=>`<button class="opt" onclick="pickQ(${j})"><span class="k">${'АБВГ'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
}
function pickQ(j){
  const q=Q.qs[Q.i], btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,k)=>{ b.disabled=true; if(q.sh[k].ok) b.classList.add('right'); });
  const ok=q.sh[j].ok;
  if(ok){ Q.pts+=20; Q.correct++; beep('ok'); } else { btns[j].classList.add('wrong'); beep('bad'); }
  const last=Q.i===Q.qs.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Верно! +20 XP':'Мимо причала'}</strong><p>${q.ex}</p>
    <button class="btn" onclick="${last?'Q.onDone(Q.pts,Q.correct)':'Q.i++;renderQ()'}">${last?'Завершить →':'Следующий вопрос →'}</button></div>`;
  $('#fb .btn').focus({preventScroll:true});
}

/* ============ ДВИЖОК: СОРТИРОВКА ============ */
let S=null;
function runSorter(cfg){
  S={...cfg, items:shuffle(cfg.items.slice()), i:0, pts:0, correct:0, combo:0, best:0, locked:false, fast:0};
  renderSort();
}
function renderSort(){
  const it=S.items[S.i];
  $('#game').innerHTML=`<div class="game-card">
    <div class="g-top"><span>${S.unit} ${S.i+1}/${S.items.length}</span><span class="combo ${S.combo>=3?'hot':''}">Комбо ×${S.combo}</span><span><em>${S.pts}</em> XP</span></div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="cargo" id="cargo"><span class="ctag">${S.tag} №${String(S.i+1).padStart(3,'0')}</span><p>${it.t}</p></div>
    <div class="gates">
      <button class="gate" style="--gc:${S.L.cc}" onclick="sortPick('${S.L.k}')">← ${S.L.label}<small>клавиша ←</small></button>
      <button class="gate" style="--gc:${S.R.cc}" onclick="sortPick('${S.R.k}')">${S.R.label} →<small>клавиша →</small></button>
    </div>
    <div id="fb"></div></div>`;
  S.locked=false; S.t0=performance.now();
  startTimer(S.time, ()=>sortPick(null));
}
function sortPick(k){
  if(!S||S.locked) return; S.locked=true; stopTimer();
  const it=S.items[S.i], ok=k===it.a, cargo=$('#cargo');
  document.querySelectorAll('.gate').forEach(b=>b.disabled=true);
  const secs=(performance.now()-S.t0)/1000;
  let gain=0;
  if(ok){ S.combo++; S.best=Math.max(S.best,S.combo); S.correct++; gain=10+(S.combo>=3?5:0); S.pts+=gain; if(secs<4) S.fast++; beep('ok');
    cargo.classList.add(k===S.L.k?'fly-l':'fly-r'); if(S.combo>=5) addBadge('combo5'); }
  else { S.combo=0; beep('bad'); cargo.classList.add('shake'); }
  const right = it.a===S.L.k?S.L.label:S.R.label;
  const last=S.i===S.items.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?`Верно! +${gain} XP${gain>10?' (комбо)':''}`:k===null?'Время вышло. Правильно: '+right:'Не тот терминал. Правильно: '+right}</strong><p>${it.ex}</p>
    <button class="btn" id="nextBtn" onclick="sortNext()">${last?'Подвести итог →':'Следующий груз →'}</button></div>`;
  $('#nextBtn').focus({preventScroll:true});
  // плавно прокрутить к пояснению на телефоне
  $('#fb').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function sortNext(){ if(!S) return; if(S.i<S.items.length-1){ S.i++; renderSort(); } else { const s=S; if(s.correct===s.items.length) addBadge('flawless'); if(s.fast>=Math.ceil(s.items.length*.6)) addBadge('speed'); S=null; s.onDone(s.pts,s.correct,s.items.length); } }
document.addEventListener('keydown',e=>{
  if(S && !S.locked){ if(e.key==='ArrowLeft'){e.preventDefault();sortPick(S.L.k);} if(e.key==='ArrowRight'){e.preventDefault();sortPick(S.R.k);} }
  if(e.key==='Escape' && !$('#overlay').hidden) go('hub');
});

        <div class="grid2">
          <div class="panel"><h3 style="color:var(--good)">Зачем идти в СП</h3><ul class="clean plus"><li>Знание рынка, связи и каналы сбыта местного партнёра</li><li>Делим инвестиции и риски</li><li>Обходим ограничения на долю иностранного капитала</li><li>Проще получить лицензии и доверие властей</li></ul></div>
          <div class="panel"><h3 style="color:var(--bad)">Чем рискуем</h3><ul class="clean minus"><li>Разные цели партнёров: дивиденды против реинвестиций</li><li>Тупики в управлении</li><li>Утечка технологий и ноу-хау</li><li>Сложный и дорогой «развод»</li></ul></div>
        </div>
        <h2 class="h2">Досье: реальные СП</h2>
        <div class="grid2">${JV_CASES.map(c=>`<div class="panel stack" style="gap:6px"><p class="mono" style="font-size:12px;color:var(--c-jv)">${c.y}</p><h3 style="margin:0">${c.n}</h3><p style="font-size:15px;color:#C7D5E3">${c.t}</p></div>`).join('')}</div>
        <p class="note"><b>Важно для экзамена.</b> У Ф. Котлера «совместная предпринимательская деятельность» шире: в неё входят лицензирование, контрактное производство, управление по контракту и совместное владение. В этой игре СП — это именно совместное владение.</p>
        <div class="row"><button class="btn" onclick="go('l4',1)">За стол переговоров →</button></div>
      </div>`);
  } else if(step===1){
    stage(lvHead('l4',1,names,'«Северная Ягода» создаёт с вьетнамской компанией Mekong Fresh завод ягодных десертов. Четыре раунда переговоров. Следите за тремя шкалами: идеального ответа нет, есть баланс.')+`<div id="game"></div>`);
    N={r:0, m:{c:50,t:50,p:50}, last:null}; renderNego();
  } else {
    stage(lvHead('l4',2,names,'Три вопроса о совместных предприятиях.')+`<div id="game"></div>`);
    runQuiz(Q_L4,(pts)=>completeLevel('l4',(N?N.score:50)+pts));
  }
}
const MNAME={c:'Наш контроль',t:'Доверие партнёра',p:'Защита интересов'};
function meterHtml(d){
  return `<div class="meters">${['c','t','p'].map(k=>{ const v=N.m[k]; const col=v<30?'var(--bad)':v<55?'var(--signal)':'var(--good)';
    const dd=d&&d[k]?`<span class="delta ${d[k]>0?'up':'dn'}">${d[k]>0?'+':''}${d[k]}</span>`:'';
    return `<div class="meter"><span>${MNAME[k]} ${dd}<b>${v}</b></span><div class="track"><div class="fill" style="width:${v}%;background:${col}"></div></div></div>`;}).join('')}</div>`;
}
function renderNego(d){
  const R=NEGO[N.r];
  $('#game').innerHTML=`<div class="game-card">
    <div class="g-top"><span>Раунд ${N.r+1}/4</span><span>Mekong Fresh · Хошимин</span></div>
    ${meterHtml(d)}
    <div class="partner"><div class="avatar">MF</div><div class="bubble">${R.who.replace('Mekong Fresh: ','')}</div></div>
    <h3 style="font-family:var(--f-body);font-size:19px">${R.q}</h3>
    <div class="choices">${R.opts.map((o,i)=>`<button class="choice" onclick="pickNego(${i})"><b>${o.t}</b><small>${o.s}</small></button>`).join('')}</div>
    <div id="fb"></div></div>`;
}
function pickNego(i){
  const o=NEGO[N.r].opts[i];
  Object.keys(o.d).forEach(k=>N.m[k]=Math.max(0,Math.min(100,N.m[k]+o.d[k])));
  const good=Object.values(o.d).reduce((a,b)=>a+b,0)>=15; beep(good?'ok':'tap');
  const last=N.r===NEGO.length-1;
  // перерисовать шкалы с дельтами
  document.querySelector('.meters').outerHTML=meterHtml(o.d);
  document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true; if(k===i) b.classList.add('picked');});
  $('#fb').innerHTML=`<div class="fb ${good?'ok':Object.values(o.d).some(v=>v<=-20)?'no':'mid'}"><strong>${o.s}</strong><p>${o.fb}</p>
    <button class="btn" onclick="${last?'finishNego()':'N.r++;renderNego()'}">${last?'Подписать соглашение →':'Следующий раунд →'}</button></div>`;
  $('#fb .btn').focus({preventScroll:true});
}
function finishNego(){
  const {c,t,p}=N.m, mn=Math.min(c,t,p), avg=(c+t+p)/3;
  N.score=Math.round(Math.min(100, avg*1.15 + (mn>=50?15:0)));
  if(mn>=55) addBadge('diplomat');
  const out = mn<30?{cls:'no',h:'Хрупкое СП: конфликт на горизонте',p:'Одна из шкал провалилась. Так начинались многие громкие «разводы» партнёров, вроде истории Danone и Wahaha. Перепройдите переговоры и ищите баланс.'}
    : mn<50?{cls:'mid',h:'Рабочее СП с уязвимостями',p:'Предприятие запущено, но в одном из направлений вы уступили слишком много. Подумайте, что вы бы изменили.'}
    : {cls:'ok',h:'Сбалансированное СП',p:'Контроль, доверие и защита в равновесии. Так выглядят долгоживущие СП вроде Fuji Xerox.'};
  $('#game').innerHTML=`<div class="game-card">
    <div class="g-top"><span>Итог переговоров</span><span><em>${N.score}</em> XP</span></div>
    ${meterHtml()}
    <div class="fb ${out.cls}"><strong>${out.h}</strong><p>${out.p}</p>
    <div class="row"><button class="btn" onclick="go('l4',2)">К проверке →</button><button class="btn ghost" onclick="go('l4',1)">Переиграть переговоры</button></div></div></div>`;
  beep(out.cls==='ok'?'win':'tap');
}

/* ============ УРОВЕНЬ 5 ============ */
let M=null;
function renderL5(step){
  const names=['Брифинг','Найди пару','Проверка'];
  if(step===0){
    stage(lvHead('l5',0,names,'Договор о сотрудничестве двух и более независимых компаний ради общей цели. Каждая остаётся самостоятельной, новая компания не обязательна.')+`
      <div class="stack">
        <div class="grid3">
          <div class="panel"><p class="eyebrow">По участию в капитале</p><ul class="clean" style="--dot:var(--c-all)"><li><span><b>Неакционерный</b> — только договор: совместный маркетинг, R&amp;D, код-шеринг</span></li><li><span><b>Акционерный</b> — партнёры покупают доли друг друга, иногда перекрёстно</span></li></ul></div>
          <div class="panel"><p class="eyebrow">По направлению</p><ul class="clean" style="--dot:var(--c-all)"><li><span><b>Горизонтальный</b> — компании одной отрасли, часто конкуренты</span></li><li><span><b>Вертикальный</b> — звенья одной цепочки: поставщик и производитель</span></li></ul></div>
          <div class="panel"><p class="eyebrow">По функции</p><ul class="clean" style="--dot:var(--c-all)"><li>Маркетинговый и кобрендинг</li><li>Технологический (R&amp;D)</li><li>Производственный</li><li>Логистический и сбытовой</li></ul></div>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Признак</th><th style="color:var(--c-all)">Стратегический альянс</th><th style="color:var(--c-jv)">Совместное предприятие</th></tr></thead>
          <tbody>
            <tr><td>Новое юрлицо</td><td>Не обязательно</td><td>Да</td></tr>
            <tr><td>Общий капитал</td><td>Не обязательно</td><td>Да</td></tr>
            <tr><td>Самостоятельность сторон</td><td>Полная</td><td>Сохраняется, но СП управляют вместе</td></tr>
            <tr><td>Гибкость и выход</td><td>Проще начать и проще выйти</td><td>Выход сложный и дорогой</td></tr>
            <tr><td>Контроль</td><td>Ограничен договором</td><td>Пропорционален доле</td></tr>
          </tbody></table></div>
        <p class="note"><b>Спорный момент.</b> Многие авторы считают СП разновидностью акционерного альянса. Если преподаватель спросит, ответьте так: всякое СП — форма союза компаний, но не всякий альянс — СП.</p>
        <div class="row"><button class="btn" onclick="go('l5',1)">К игре «Найди пару» →</button></div>
      </div>`);
  } else if(step===1){
    stage(lvHead('l5',1,names,'Под контейнерами спрятаны четыре реальных альянса и их суть. Откройте два контейнера: если альянс и его описание совпали, пара остаётся открытой.')+`<div id="game"></div>`);
    const cards=[]; MEM_PAIRS.forEach((p,i)=>{ cards.push({id:i,txt:p.a,name:true}); cards.push({id:i,txt:p.b,name:false}); });
    M={cards:shuffle(cards), open:[], matched:new Set(), moves:0, busy:false}; renderMem();
  } else {
    stage(lvHead('l5',2,names,'Три вопроса об альянсах.')+`<div id="game"></div>`);
    runQuiz(Q_L5,(pts)=>completeLevel('l5',(M?M.score:50)+pts));
  }
}
function renderMem(){
  $('#game').innerHTML=`<div class="game-card">
    <div class="g-top"><span>Ходов: ${M.moves}</span><span>Найдено пар: ${M.matched.size}/4</span></div>
    <div class="mem">${M.cards.map((c,i)=>{ const on=M.open.includes(i), mt=M.matched.has(c.id);
      return `<button class="mcard ${on?'on':''} ${mt?'matched':''}" onclick="memPick(${i})" ${mt?'disabled':''} aria-label="${on||mt?esc(c.txt):'Закрытый контейнер'}">
        <div class="flip-in"><div class="face front"><span>?</span></div><div class="face back ${c.name?'name':''}">${c.txt}</div></div></button>`;}).join('')}</div>
    <div id="fb"></div></div>`;
}
function memPick(i){
  if(M.busy||M.open.includes(i)||M.matched.has(M.cards[i].id)) return;
  M.open.push(i); beep('tap');
  document.querySelectorAll('.mcard')[i].classList.add('on');
  if(M.open.length===2){
    M.moves++; M.busy=true; const [a,b]=M.open.map(k=>M.cards[k]);
    if(a.id===b.id && a.name!==b.name){ M.matched.add(a.id); M.open=[]; M.busy=false; beep('ok');
      setTimeout(()=>{ renderMem(); if(M.matched.size===4) memDone(); },350);
    } else { setTimeout(()=>{ M.open=[]; M.busy=false; renderMem(); },1000); }
    document.querySelector('.g-top span').textContent='Ходов: '+M.moves;
  }
}
function memDone(){
  M.score=Math.max(40,100-(M.moves-4)*8); if(M.moves<=6) addBadge('memory'); beep('win');
  $('#fb').innerHTML=`<div class="fb ok"><strong>Все альянсы найдены за ${M.moves} ходов. +${M.score} XP</strong>
    <p>Star Alliance (с 1997 года) — горизонтальный неакционерный альянс авиакомпаний. Starbucks и PepsiCo с 1994 года вместе продают готовый кофе в бутылках: бренд одного, дистрибуция другого. Renault и Nissan с 1999 года связаны перекрёстным владением акциями — это акционерный альянс. Spotify и Uber в 2014 году запустили кросс-маркетинговый проект: пассажир включал свою музыку в машине.</p>
    <button class="btn" onclick="go('l5',2)">К проверке →</button></div>`;
}

/* ============ БОСС ============ */
let B=null;
function renderBoss(){
  stage(lvHead('boss',0,['Заседание'],'Совет директоров приносит восемь кейсов от разных компаний. Для каждого выберите лучшую стратегию выхода на рынок. 35 секунд на кейс, три контейнера жизни. Почти правильный ответ даёт часть очков и не отнимает жизнь.')+`<div id="game"></div>`);
  B={cases:shuffle(BOSS.slice()), i:0, pts:0, lives:3, right:0, over:false};
  bossCase();
}
function bossCase(){
  const c=B.cases[B.i];
  B.opts=shuffle(['indirect','direct','alliance','jv']); B.locked=false;
  $('#game').innerHTML=`<div class="game-card quiz">
    <div class="g-top"><span>Кейс ${B.i+1}/${B.cases.length}</span><span class="lives">${[0,1,2].map(k=>`<i class="${k<B.lives?'':'lost'}" title="Жизнь"></i>`).join('')}</span><span><em>${B.pts}</em> XP</span></div>
    <div class="timer"><i id="tbar"></i></div>
    <p class="case-co">${c.co}</p>
    <h3>${c.t}</h3>
    <div class="opts">${B.opts.map((k,j)=>`<button class="opt" style="--cc:${ST[k].cc}" onclick="bossPick(${j})"><span class="sw"></span><span>${ST[k].name}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
  startTimer(35,()=>bossPick(-1));
}
function bossPick(j){
  if(!B||B.locked) return; B.locked=true; const left=T.left; stopTimer();
  const c=B.cases[B.i], k=j>=0?B.opts[j]:null, btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,n)=>{ b.disabled=true; if(B.opts[n]===c.best) b.classList.add('right'); });
  let cls, head, gain=0;
  if(k===c.best){ gain=20+Math.ceil(left/35*10); B.right++; cls='ok'; head=`Совет аплодирует! +${gain} XP`; beep('ok'); }
  else if(k && k===c.part){ gain=8; cls='mid'; head='Неплохо, но есть вариант точнее. +8 XP'; btns[j].classList.add('part'); beep('tap'); }
  else { B.lives--; cls='no'; head=k?'Совет недоволен. Минус контейнер':'Время вышло. Минус контейнер'; if(j>=0) btns[j].classList.add('wrong'); beep('bad'); }
  B.pts+=gain;
  document.querySelector('.lives').innerHTML=[0,1,2].map(n=>`<i class="${n<B.lives?'':'lost'}"></i>`).join('');
  const end = B.lives<=0 || B.i===B.cases.length-1;
  $('#fb').innerHTML=`<div class="fb ${cls}"><strong>${head}</strong><p><b>Лучший выбор: ${ST[c.best].name}.</b> ${c.ex}</p>
    <button class="btn" onclick="${end?'bossEnd()':'B.i++;bossCase()'}">${end?(B.lives<=0?'Заседание окончено →':'Итоги заседания →'):'Следующий кейс →'}</button></div>`;
  $('#fb .btn').focus({preventScroll:true});
  $('#fb').scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function bossEnd(){
  const b=B; B=null;
  if(b.right===b.cases.length) addBadge('flawless');
  if(b.lives<=0){
    $('#game').innerHTML=`<div class="game-card"><div class="fb no"><strong>Совет директоров прервал заседание</strong>
      <p>Вы потеряли все контейнеры на кейсе ${b.i+1} из ${b.cases.length}. Набрано ${b.pts} XP. Можно сдать результат как есть или попробовать снова: кейсы перемешаются.</p>
      <div class="row"><button class="btn" onclick="renderBoss()">Попробовать снова</button><button class="btn ghost" onclick="completeLevel('boss',${b.pts})">Сдать с результатом ${b.pts} XP</button></div></div></div>`;
    return;
  }
  completeLevel('boss',b.pts);
}

/* ============ ФИНАЛ ============ */
function renderFinal(){
  const pts=total(), rk=rankOf(pts);
  const weak=LEVELS.filter(l=>state.done[l.id]!=null && state.done[l.id]/l.max<.65);
  const num='СЯ-2026-'+String(1000+((pts*37+ (state.name||'x').length*101)%9000));
  stage(`<section class="stack" style="gap:22px">
    <div class="stack" style="gap:8px"><p class="eyebrow">Рейс завершён</p><h1 class="h1">Груз доставлен</h1></div>
    <div class="cert"><div class="cert-in">
      <p class="eyebrow">Коносамент № ${num} · сертификат о прохождении</p>
      <h2>Классификация стратегий выхода на зарубежный рынок</h2>
      <dl>
        <dt>Капитан</dt><dd>${esc(state.name)||'Директор по международному развитию'}</dd>
        <dt>Компания</dt><dd>«Северная Ягода», Петрозаводск</dd>
        <dt>Груз</dt><dd>Косвенный и прямой экспорт, совместные предприятия, стратегические альянсы</dd>
        <dt>Набрано</dt><dd>${pts} из ${MAX_TOTAL} XP (${Math.round(pts/MAX_TOTAL*100)}%)</dd>
        <dt>Дата</dt><dd>${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</dd>
      </dl>
      <div><p class="eyebrow">Присвоено звание</p><p class="rank">${rk.name}</p><p>${rk.txt}</p></div>
      <div class="stamps">${LEVELS.map((lv,i)=>stampHtml(lv,state.done[lv.id]==null,i)).join('')}</div>
    </div></div>
    ${state.badges.length?`<div class="panel stack" style="gap:10px"><p class="eyebrow">Особые награды</p><div class="badges" style="justify-content:flex-start">${state.badges.map(b=>`<span class="badge">${BADGE_NAMES[b]}</span>`).join('')}</div></div>`:''}
    ${weak.length?`<div class="panel stack" style="gap:10px"><p class="eyebrow">Стоит повторить</p><div class="row">${weak.map(l=>`<button class="btn ghost" onclick="go('${l.id}')">${l.title} · ${state.done[l.id]}/${l.max}</button>`).join('')}</div></div>`:''}
    <p class="note"><b>Совет:</b> сделайте скриншот сертификата и отправьте преподавателю.</p>
    <div class="row"><button class="btn ghost" onclick="go('hub')">На карту</button><button class="btn ghost" onclick="resetAll()">Пройти рейс заново</button></div>
  </section>`);
  if(!RM) confetti();
}

/* ============ СТАРТ ============ */
syncSnd();
go(state.screen && state.screen!=='final' && state.screen!=='boss' && !/^l\d$/.test(state.screen) ? state.screen : (Object.keys(state.done).length?'hub':'intro'));
</script>

</body></html>
